# Link to code
# https://notes.kodekloud.com/docs/GitHub-Actions-Certification/GitHub-Actions-Core-Concepts/Storing-workflow-data-as-artifacts/page

name: Generate ASCII Artwork

on:
  workflow_dispatch:
    
jobs:
  build_job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cowsay Program
        run: sudo apt-get install cowsay -y

      - name: Execute Cowsay
        run: cowsay -f dragon "Run for cover, I am a DRAGON....RAWR" >> dragon.txt

      - name: Upload Dragon text file
        uses: actions/upload-artifact@v3
        with:
          name: dragon-text-file
          path: dragon.txt

  test_job_2:
    needs: build_job_1
    runs-on: ubuntu-latest
    steps:
        - name: Download Dragon text file
          uses: actions/download-artifact@v3
          with:
            name: dragon-text-file

        - name: Verify Content
          run: grep -i "dragon" dragon.txt

  deploy_job_3:
    needs: test_job_2
    runs-on: ubuntu-latest
    steps:
        - name: Download Dragon text file
          uses: actions/download-artifact@v3
          with:
            name: dragon-text-file

        - name: Display File
          run: cat dragon.txt

        - name: Deploy
          run: echo "Deploying ......"
    